@if (loaderVisible()) {
  <app-site-loader [name]="data().name" [title]="data().title" />
}

<app-site-cursor />

<div class="portfolio-shell">
  <div class="ambient-field" aria-hidden="true">
    <span class="ambient-field__wash"></span>
    <span class="ambient-field__grid"></span>
    <span class="ambient-field__noise"></span>
  </div>

  <a class="skip-link" href="#main-content">Skip to content</a>

  <app-portfolio-nav [name]="data().name" (navigate)="scrollTo($event)" />

  <main id="main-content">
    <app-hero-section [data]="data()" (navigate)="scrollTo($event)" />
    <app-about-section [data]="data()" />
    <app-experience-section [data]="data()" />
    <app-projects-section [data]="data()" />
    <app-skills-section [data]="data()" />
    <app-education-section [data]="data()" />
    <app-contact-section [data]="data()" />
  </main>

  <app-site-footer [data]="data()" [year]="year" (navigate)="scrollTo($event)" />
</div>
