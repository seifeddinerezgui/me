name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deploy at a time, don't cancel an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # base-href must match the repo name so assets resolve under /me/
      - run: npx ng build --configuration production --base-href /me/

      # SPA fallback: GitHub Pages serves 404.html on unknown paths,
      # copy index.html so Angular router deep links (e.g. /admin) work
      - run: cp dist/ser/browser/index.html dist/ser/browser/404.html

      # skip Jekyll processing
      - run: touch dist/ser/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/ser/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
